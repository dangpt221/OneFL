[project]
name = "onefl-backend"
version = "1.0.0"
description = "OneFL Video Translation & Subtitle Burner Backend Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "edge-tts>=6.1.12",
    "gtts>=2.5.1",
    "mutagen>=1.47.0",
    "openai>=1.35.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "imageio-ffmpeg>=0.5.1",
    "jinja2>=3.1.4",
    "redis>=5.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
]
